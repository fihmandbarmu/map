<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar">
    <h2>Map Explorer</h2>
    <div class="search-box">
      <input type="text" id="address-input" placeholder="Search address or location..." />
      <button id="search-btn">Search</button>
    </div>
    <div id="controls">
      <button id="location-btn">Use My Location</button>
      <button id="clear-markers-btn" class="secondary">Clear Custom Markers</button>
    </div>
    <div id="results">Click anywhere on the map to place a custom pin!</div>
  </div>
  
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
