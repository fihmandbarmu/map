<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Google Maps Clone</title>
  
  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a73e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Active Turn-by-Turn Header -->
  <div id="nav-banner">
    <div class="nav-icon">🚗</div>
    <div class="nav-details">
      <div id="nav-instruction">Head towards destination</div>
      <div id="nav-distance">Calculating route...</div>
    </div>
  </div>

  <!-- Google Maps Style Sidebar -->
  <div id="sidebar">
    <div class="brand">
      <span class="logo-text"><span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span> Maps</span>
      <!-- Open App instance in a New Browser Tab -->
      <a href="./index.html" target="_blank" rel="noopener noreferrer" style="float: right; text-decoration: none; font-size: 0.8rem; color: #1a73e8;">Open in New Tab ↗</a>
    </div>

    <!-- Interface Mode Tabs -->
    <div class="tab-group">
      <button class="tab-btn active" id="tab-search">Search</button>
      <button class="tab-btn" id="tab-directions">Directions</button>
    </div>

    <!-- Search Panel -->
    <div id="panel-search" class="panel active">
      <div class="input-wrapper">
        <input type="text" id="search-input" placeholder="Search Google Maps..." autocomplete="off" />
        <button id="search-btn">🔍</button>
      </div>
      <div id="search-results" class="results-dropdown"></div>
    </div>

    <!-- Directions Panel -->
    <div id="panel-directions" class="panel">
      <div class="travel-modes">
        <button class="mode-btn active" data-mode="car">🚗 Drive</button>
        <button class="mode-btn" data-mode="foot">🚶 Walk</button>
        <button class="mode-btn" data-mode="bike">🚴 Bike</button>
      </div>
      <div class="input-wrapper">
        <input type="text" id="start-input" placeholder="Choose starting point..." />
      </div>
      <div class="input-wrapper">
        <input type="text" id="end-input" placeholder="Choose destination..." />
      </div>
      <button id="route-btn" class="primary-btn">Start Navigation</button>
      <button id="clear-route-btn" class="secondary-btn">Clear Route</button>
    </div>

    <!-- App Install Banner Button -->
    <button id="install-pwa-btn" class="primary-btn" style="display: none; background: #34a853; margin-top: 8px;">
      📲 Download Map App
    </button>

    <div id="status-message">Click anywhere on the map to drop a custom pin.</div>
  </div>

  <!-- Map Canvas -->
  <div id="map"></div>

  <!-- Map Controls -->
  <div id="layer-controls">
    <button id="btn-streets" class="layer-btn active">Map</button>
    <button id="btn-satellite" class="layer-btn">Satellite</button>
    <button id="btn-location" class="layer-btn" title="My Location">🎯</button>
  </div>

  <!-- Service Worker and PWA Install Handler -->
  <script>
    // 1. Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered Successfully.'))
        .catch(err => console.error('Service Worker Registration Failed:', err));
    }

    // 2. Handle PWA App Download Prompt
    let deferredPrompt;
    const installBtn = document.getElementById('install-pwa-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });
  </script>

  <!-- JS Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
